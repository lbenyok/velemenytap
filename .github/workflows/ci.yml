name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veleminytap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veleminytap/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # Playwright e2e needs a real Supabase project to hit (see e2e/README.md
  # and DECISIONS.md for why this project reuses the same one dev/prod
  # use, rather than a Docker-based local stack). Until those secrets are
  # added to the repo, this job skips instead of failing CI outright.
  check-e2e-secrets:
    name: Check e2e secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.SUPABASE_SECRET_KEY }}" ] && \
             [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && \
             [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::One or more e2e secrets are missing (need all three: SUPABASE_SECRET_KEY, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY) -- e2e job will be skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright e2e (review-gating regression)
    needs: [checks, check-e2e-secrets]
    if: needs.check-e2e-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veleminytap
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Optional (round-3 R3-01/verification): direct Postgres connection
      # string for the isolated project, for e2e/location-deactivation-race.spec.ts's
      # real two-connection concurrency test. That test skips itself (not a
      # failure) if this isn't set -- add SUPABASE_DB_URL as a repo secret to
      # have it actually run in CI instead of always skipping.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veleminytap/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: veleminytap/playwright-report/
          retention-days: 14
