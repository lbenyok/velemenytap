name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veleminytap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veleminytap/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # Playwright e2e needs a real (isolated, non-production) Supabase project
  # to hit -- see e2e/README.md and DECISIONS.md.
  #
  # Round-4 finding R4-04: SUPABASE_DB_URL is now REQUIRED alongside the
  # other three, not optional -- a security-relevant privilege matrix and a
  # concurrency-safety guarantee reporting green without ever actually
  # running is false confidence, not missing coverage that degrades
  # gracefully.
  #
  # Round-5 finding R5-01: R4-04 wasn't actually enforced end to end --
  # this job used to just warn and skip on missing secrets unconditionally,
  # so removing or misconfiguring one secret left `master` green while
  # every database-dependent check silently never ran. scripts/check-e2e-
  # secrets.mjs (unit tested) now fails this job outright when secrets are
  # missing on a TRUSTED ref (a push to master, or a pull_request from a
  # branch within this same repo -- both of which GitHub Actions does give
  # repository secrets to). A fork pull request is the one legitimate case
  # secrets are genuinely absent (GitHub never exposes them to a forked
  # head), so that case still skips gracefully, not fails.
  check-e2e-secrets:
    name: Check e2e secrets are configured
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veleminytap
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/check-e2e-secrets.mjs

  e2e:
    name: Playwright e2e (review-gating regression)
    needs: [checks, check-e2e-secrets]
    if: needs.check-e2e-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veleminytap
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Mandatory in CI as of round-4 R4-04 (see check-e2e-secrets above) --
      # direct Postgres connection string for the isolated project, used by
      # e2e/rpc-privilege-matrix.spec.ts and
      # e2e/location-deactivation-race.spec.ts. e2e/support/db-connection.ts
      # throws (fails the run) rather than skipping if this is unset,
      # unreachable, or doesn't resolve to the approved isolated project --
      # skip-on-missing is a local-development-only convenience now.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: veleminytap/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: veleminytap/playwright-report/
          retention-days: 14

  # Round-4 finding R4-01. Confirms Vercel actually deployed the commit
  # that was just pushed to master, by polling the live production
  # /api/health endpoint until it reports this exact SHA. This is what
  # catches the historical failure mode that motivated it: GitHub CI can
  # be fully green while Vercel's Git webhook silently never fires (or
  # fires but the build fails, or fixes-but-never-promotes) -- production
  # then keeps serving whatever it was already running, indefinitely, with
  # nothing in this repository's own CI ever noticing. That happened for
  # real, for an extended period spanning three review rounds (STATUS.md).
  #
  # This job cannot configure Vercel or GitHub itself -- see DEPLOYMENT.md
  # for the external settings (Vercel Git connection, Root Directory,
  # "Automatically expose System Environment Variables", branch protection
  # required-status-checks) this check depends on but cannot enforce.
  verify-production-deployment:
    name: Verify production deployment matches this commit
    needs: [checks, e2e]
    # Round-5 R5-01: `!= 'failure'` also passed for a *skipped* e2e job
    # (e.g. check-e2e-secrets not run yet, or -- before this same finding's
    # fix -- silently missing secrets on master) -- production could
    # promote-verify without the e2e suite having run at all. Requiring
    # `== 'success'` closes that: a skip is no longer indistinguishable
    # from a pass for this gate's purposes.
    if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.checks.result == 'success' && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Poll production until /api/health reports this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          # Repository variable, not a secret -- this is the app's own
          # public production URL. Falls back to the known default so this
          # keeps working even if the variable is never explicitly set.
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL || 'https://veleminytap.vercel.app/api/health' }}
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            response="$(curl -fsS --max-time 10 "$HEALTH_URL" || echo '')"
            if [ -n "$response" ]; then
              actual_sha="$(node -e "try{console.log(JSON.parse(process.argv[1]).commitSha||'')}catch{console.log('')}" "$response")"
              ok="$(node -e "try{console.log(JSON.parse(process.argv[1]).ok===true)}catch{console.log('false')}" "$response")"
              if [ "$ok" = "true" ] && [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                echo "Production is serving the expected commit ($EXPECTED_SHA)."
                exit 0
              fi
              echo "Not yet -- production reports commitSha=$actual_sha ok=$ok, expected $EXPECTED_SHA. Retrying in 15s."
            else
              echo "No response from $HEALTH_URL yet. Retrying in 15s."
            fi
            sleep 15
          done
          echo "::error::Production did not report commit $EXPECTED_SHA within 5 minutes. This does NOT necessarily mean the code is broken -- it means the Vercel deployment either failed, never started (the Git webhook not firing is a real, previously-confirmed failure mode for this project -- see STATUS.md), or hasn't been promoted to Production yet. Check the Vercel Deployments dashboard directly; do not assume this is a false alarm."
          exit 1
